name: CD - Inkapark

on:
  push:
    branches: ["master"]

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Generar archivo ejecutable
        run: mvn clean package -DskipTests

      - name: Preparar paquete de ejecución
        run: |
          mkdir -p dist
          cp target/*.jar dist/
          cp src/main/resources/application-example.properties dist/
          cp README-EJECUCION.md dist/
          cp -r database dist/database

      - name: Publicar paquete como artifact
        uses: actions/upload-artifact@v4
        with:
          name: inkapark-aplicacion
          path: dist/
          if-no-files-found: error
          retention-days: 30